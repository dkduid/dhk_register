{% extends 'base.html' %}{% from '_m.html' import head, csrf %}{% block title %}Ubah password{% endblock %}
{% block body %}{{ head('Ubah password', 'Minimal 10 karakter dengan huruf besar, huruf kecil, angka, dan simbol.') }}
<form method="post" class="card form narrow">{{ csrf() }}<label>Password lama<input type="password" name="old" required></label>
<label>Password baru<input type="password" name="new" required minlength="10"></label><label>Ulangi password baru<input type="password" name="new2" required></label>
<button class="btn pri">Simpan password</button></form>{% endblock %}
